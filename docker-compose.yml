version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pest_postgres
    environment:
      POSTGRES_USER: pest_user
      POSTGRES_PASSWORD: pest_password
      POSTGRES_DB: pest_operations
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pest_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: pest_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://pest_user:pest_password@postgres:5432/pest_operations
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecret_pest_jwt_key_2026
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: pest_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  pgdata:
